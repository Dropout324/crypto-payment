# Template only - every value below is a placeholder and this file is NOT
# meant to be applied as-is. Run scripts/kubernetes/generate-secret.sh to
# produce a real infrastructure/kubernetes/secret.yaml (gitignored) with
# freshly generated values, or generate the same keys from your own KMS/
# secrets manager and `kubectl apply` that instead.
#
# This is deliberately a single Secret for baseline deployability. Splitting
# secrets by service, sourcing them from a real KMS/Vault backend, and
# rotating them without downtime is Phase 11 scope (see
# README.md#roadmap's "Boundary with Phase 10") -
# @gateway/security's SecretsProvider seam (ADR 0012) is what a Phase 11
# pass would wire a real backend into; this manifest is the
# environment-variable seam Kubernetes itself expects underneath that.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: gateway
type: Opaque
stringData:
  POSTGRES_USER: "gateway"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "gateway"
  # api/worker/monitor connect as the least-privilege `gateway_app` role
  # (Phase 17 pass 1, ADR 0031) - CRUD only, no DDL, no superuser.
  # infrastructure/kubernetes/migration-job.yaml provisions this role via
  # `pnpm db:provision-app-role` every time it runs, using
  # DATABASE_MIGRATE_URL below.
  DATABASE_URL: "postgresql://gateway_app:CHANGE_ME_APP_ROLE_PASSWORD@postgres:5432/gateway?schema=public&connection_limit=20&pool_timeout=10"
  GATEWAY_APP_DB_PASSWORD: "CHANGE_ME_APP_ROLE_PASSWORD"
  # Superuser connection - migrations and role provisioning only. Never
  # injected into api/worker/monitor; only migration-job.yaml uses it.
  DATABASE_MIGRATE_URL: "postgresql://gateway:CHANGE_ME@postgres:5432/gateway?schema=public&connection_limit=20&pool_timeout=10"
  REDIS_URL: "redis://redis:6379"
  JWT_ACCESS_SECRET: "CHANGE_ME_48_RANDOM_BYTES"
  JWT_REFRESH_SECRET: "CHANGE_ME_DIFFERENT_48_RANDOM_BYTES"
  ENCRYPTION_KEY: "CHANGE_ME_32_RANDOM_BYTES_BASE64"
  ENCRYPTION_KEY_ID: "k8s-baseline-1"
  COINGECKO_API_KEY: ""
  ETHEREUM_RPC_URL: ""
  ETHEREUM_RPC_WS_URL: ""
  ETHEREUM_RPC_FALLBACK_URL: ""
  POLYGON_RPC_URL: ""
  POLYGON_RPC_WS_URL: ""
  POLYGON_RPC_FALLBACK_URL: ""
  BSC_RPC_URL: ""
  BSC_RPC_WS_URL: ""
  BSC_RPC_FALLBACK_URL: ""
  BITCOIN_RPC_URL: ""
  BITCOIN_RPC_USER: ""
  BITCOIN_RPC_PASSWORD: ""
  ETHEREUM_SEPOLIA_RPC_URL: ""
  POLYGON_AMOY_RPC_URL: ""
  BSC_TESTNET_RPC_URL: ""
  BITCOIN_TESTNET_RPC_URL: ""
  SIGNING_SERVICE_URL: ""
  SIGNING_SERVICE_TOKEN: ""
  KMS_KEY_ID: ""
  COMPLIANCE_API_KEY: ""
