# Baseline Prometheus - a single Deployment, emptyDir storage (retention
# does not need to survive a pod restart for this baseline; a PVC + retention
# policy is Phase 16 scope alongside the alert rules that would actually need
# history to fire against).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.7.3
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=6h"
          ports:
            - containerPort: 9090
          # See infrastructure/kubernetes/api.yaml's comment - a
          # startupProbe stops liveness from killing this container before
          # it finishes booting under load.
          startupProbe:
            httpGet: { path: /-/ready, port: 9090 }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: gateway
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
