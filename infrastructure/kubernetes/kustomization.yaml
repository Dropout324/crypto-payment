# Deploy the core services with:
#   kubectl apply -k infrastructure/kubernetes
# secret.yaml (generated by scripts/kubernetes/generate-secret.sh, gitignored)
# is deliberately NOT listed here - apply it once yourself before this, so a
# `kubectl apply -k` re-run never accidentally regenerates or overwrites live
# secrets. See scripts/kubernetes/deploy.sh for the full ordered sequence
# (namespace -> secret -> config -> postgres/redis -> migration Job -> the
# four services), which this alone does not enforce.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - migration-job.yaml
  - api.yaml
  - worker.yaml
  - monitor.yaml
  - web.yaml
